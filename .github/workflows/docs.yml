name: Build and publish docs

# Every push and pull request to `main` builds the library, the homepage (`home_page/`) and the API
# documentation (`scripts/build_api_docs.sh`). The API docs come from doc-gen4, the generator behind
# mathlib4_docs, run on SHSLib's own modules only: names from Mathlib, Batteries and Lean core link to
# the Mathlib documentation at https://leanprover-community.github.io/mathlib4_docs/.
#
# Pushes to `main` then deploy both to GitHub Pages:
#   https://cavargar.github.io/SHSLib/       homepage
#   https://cavargar.github.io/SHSLib/docs/  API documentation
# A weekly run does the same, so links follow Mathlib declarations that move to other files.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build library and docs
    runs-on: ubuntu-latest
    steps:
      # Mathlib's build needs more room than a fresh runner has.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain from `lean-toolchain`, fetches the Mathlib cache and runs `lake build`.
      - name: Build library
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2

      # The homepage is built first, into `_site`. The API docs are copied into `_site/docs`
      # afterwards, so Jekyll never walks the generated HTML files.
      - name: Build homepage
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: home_page
          destination: ./_site

      # Writes `docbuild/` with doc-gen4 pinned to the tag matching `lean-toolchain`, documents the
      # published modules into `docbuild/.lake/api/doc` and points links into Mathlib, Batteries and
      # Lean core at the Mathlib documentation.
      - name: Build API docs
        run: scripts/build_api_docs.sh

      # The Jekyll step runs in a container as root, so `_site` belongs to root.
      - name: Assemble site
        run: |
          sudo chown -R "$(id -un)" _site
          cp -r docbuild/.lake/api/doc _site/docs

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
