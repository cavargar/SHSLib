name = "SHSLib"
version = "2.4.0"
keywords = ["math", "stochastic-hybrid-systems", "formalization"]
description = "Stochastic hybrid systems formalized in Lean 4 / Mathlib: Hespanha's SHS, Davis PDMPs, Bect's generalized Fokker–Planck–Kolmogorov equation, Gardiner's differential Chapman–Kolmogorov equation and Itô calculus"
homepage = "https://cavargar.github.io/SHSLib/"
license = "MIT"
defaultTargets = ["SHSLib"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "SHSLib"
globs = ["SHSLib.*"]

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion"
rev = "4fa8fc01e59d6ee3fb0cce4897b48005d7d00f18"
