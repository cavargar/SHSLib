name = "SHSLib"
version = "2.2.0"
keywords = ["math", "stochastic-hybrid-systems", "formalization"]
defaultTargets = ["SHSLib"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "SHSLib"
globs = ["SHSLib.+"]

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion"
rev = "4fa8fc01e59d6ee3fb0cce4897b48005d7d00f18"
